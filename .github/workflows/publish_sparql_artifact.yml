name: Publish SPARQL Statements Artifact

# Workflow will publish an OCI artifact of
# all SPARQL statements on each push to main and
# tag it according to the git commit. That way we
# can regression test and compare against previous
# SPARQL queries if needed.

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: write # needed to push to ghcr.io

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            JSON_FILE: sparql-queries.json
            PACKAGE_NAME: explorer-sparql-statements
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Export SPARQL statements to JSON
              run: npm run sparql:export -- "$JSON_FILE"

            - name: Setup ORAS
              uses: oras-project/setup-oras@v1

            - name: Log in to GitHub Container Registry
              run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Push JSON as an OCI artifact tagged with the commit hash and latest
              run: |
                  # image references must be lowercase
                  IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PACKAGE_NAME}"
                  oras push "${IMAGE}:${GITHUB_SHA},latest" \
                      --artifact-type application/vnd.geoconnex.sparql-queries.v1+json \
                      --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                      --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                      --annotation "org.opencontainers.image.description=SPARQL statements used within the Geoconnex Explorer" \
                      "${JSON_FILE}:application/json"
