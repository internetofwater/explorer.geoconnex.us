name: Publish SPARQL Statements Artifact

# Workflow will publish an OCI artifact of
# all SPARQL statements on each push to main and
# tag it according to the git commit. That way we
# can regression test and compare against previous
# SPARQL queries if needed.

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write # needed to create releases

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            JSON_FILE: sparql-queries.json
            OCI_LAYOUT_DIR: sparql-oci
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Export SPARQL statements to JSON
              run: npm run sparql:export -- "$JSON_FILE"

            - name: Setup ORAS
              uses: oras-project/setup-oras@v1

            - name: Package JSON as an OCI artifact tagged with the commit hash
              run: |
                  oras push --oci-layout "${OCI_LAYOUT_DIR}:${GITHUB_SHA}" \
                      --artifact-type application/vnd.geoconnex.sparql-queries.v1+json \
                      --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                      --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                      "${JSON_FILE}:application/json"
                  tar -czf "sparql-oci-${GITHUB_SHA}.tar.gz" -C "$OCI_LAYOUT_DIR" .

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "sparql-${GITHUB_SHA}" \
                      --target "$GITHUB_SHA" \
                      --title "SPARQL statements within Explorer git commit: ${GITHUB_SHA::7}" \
                      --notes "SPARQL statements generated from commit ${GITHUB_SHA}. The tarball is an OCI image layout tagged \`${GITHUB_SHA}\`; extract it and run \`oras pull --oci-layout <dir>:${GITHUB_SHA}\` to retrieve the JSON." \
                      --latest \
                      "sparql-oci-${GITHUB_SHA}.tar.gz" \
                      "$JSON_FILE"
